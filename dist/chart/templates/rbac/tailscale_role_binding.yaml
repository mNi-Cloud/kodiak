{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kodiak.fullname" . }}-tailscale-connector-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kodiak.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kodiak.fullname" . }}-tailscale-connector-role
subjects:
- kind: ServiceAccount
  name: {{ include "kodiak.fullname" . }}-tailscale-connector
  namespace: {{ .Release.Namespace }}
{{- end }}
