apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kodiak.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kodiak.manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controllerManager.replicas }}
  selector:
    matchLabels:
      {{- include "kodiak.manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- if .Values.ionscale.enabled }}
        checksum/ionscale-secret: {{ include (print $.Template.BasePath "/ionscale/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.controllerManager.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kodiak.manager.labels" . | nindent 8 }}
        {{- with .Values.controllerManager.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kodiak.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.controllerManager.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.controllerManager.image.repository }}:{{ default .Chart.AppVersion .Values.controllerManager.image.tag }}"
          imagePullPolicy: {{ .Values.controllerManager.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --tailscale-image={{ .Values.tailscale.image }}
            {{- if .Values.managedControlPlane.apiEndpoint }}
            - --ionscale-api-endpoint={{ .Values.managedControlPlane.apiEndpoint }}
            {{- else if .Values.ionscale.enabled }}
            - --ionscale-api-endpoint={{ include "kodiak.ionscale.apiEndpoint" . }}
            {{- end }}
            {{- if .Values.managedControlPlane.loginURL }}
            - --ionscale-login-url={{ .Values.managedControlPlane.loginURL }}
            {{- else if .Values.ionscale.enabled }}
            - --ionscale-login-url={{ include "kodiak.ionscale.serverURL" . }}
            {{- end }}
            {{- if .Values.managedControlPlane.skipTLSVerify }}
            - --ionscale-skip-tls-verify
            {{- end }}
          {{- if or .Values.managedControlPlane.adminKeySecretRef.name .Values.ionscale.enabled }}
          env:
            - name: IONSCALE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.managedControlPlane.adminKeySecretRef.name }}
                  name: {{ .Values.managedControlPlane.adminKeySecretRef.name }}
                  key: {{ .Values.managedControlPlane.adminKeySecretRef.key }}
                  {{- else }}
                  name: {{ include "kodiak.fullname" . }}-ionscale-admin
                  key: systemAdminKey
                  {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controllerManager.resources | nindent 12 }}
      {{- with .Values.controllerManager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
