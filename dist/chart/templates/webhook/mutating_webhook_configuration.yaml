{{- if .Values.webhook.enable }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "kodiak.fullname" . }}-mutating-webhook-configuration
  labels:
    {{- include "kodiak.labels" . | nindent 4 }}
  {{- if .Values.certmanager.enable }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kodiak.fullname" . }}-serving-cert
  {{- end }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "kodiak.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-kodiak-mnicloud-jp-v1alpha1-authkey
  failurePolicy: Fail
  name: mauthkey-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kodiak.mnicloud.jp
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - authkeys
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "kodiak.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-kodiak-mnicloud-jp-v1alpha1-connector
  failurePolicy: Fail
  name: mconnector-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kodiak.mnicloud.jp
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - connectors
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "kodiak.fullname" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-kodiak-mnicloud-jp-v1alpha1-tailnet
  failurePolicy: Fail
  name: mtailnet-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kodiak.mnicloud.jp
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tailnets
  sideEffects: None
{{- end }}
