{{- if and .Values.ionscale.enabled .Values.ionscale.externalService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ionscale.externalService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kodiak.ionscale.labels" . | nindent 4 }}
  {{- with .Values.ionscale.externalService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.ionscale.externalService.loadBalancerClass }}
  loadBalancerClass: {{ . | quote }}
  {{- end }}
  externalTrafficPolicy: {{ .Values.ionscale.externalService.externalTrafficPolicy }}
  selector:
    {{- include "kodiak.ionscale.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.ionscale.externalService.port }}
      targetPort: api
      protocol: TCP
{{- end }}
