{{- if .Values.ionscale.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ionscale
  namespace: {{ .Release.Namespace }}
  {{- with .Values.ionscale.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "kodiak.ionscale.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ionscale.service.type }}
  selector:
    {{- include "kodiak.ionscale.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.ionscale.service.port }}
      targetPort: api
      protocol: TCP
    - name: metrics
      port: {{ .Values.ionscale.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
    - name: stun
      port: {{ .Values.ionscale.service.stunPort }}
      targetPort: stun
      protocol: UDP
{{- end }}
