{{- if .Values.ionscale.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kodiak.fullname" . }}-ionscale-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kodiak.ionscale.labels" . | nindent 4 }}
data:
  config.yaml: |
    listen_addr: ":8080"
    metrics_listen_addr: ":9091"
    stun_listen_addr: ":3478"

    server_url: {{ include "kodiak.ionscale.serverUrl" . | quote }}

    database:
      {{- if eq .Values.ionscale.database.type "postgres" }}
      type: postgres
      url: {{ .Values.ionscale.database.postgresUrl | quote }}
      {{- else }}
      type: sqlite
      url: /var/lib/ionscale/ionscale.db
      {{- end }}

    tls:
      disable: {{ .Values.ionscale.tls.disable }}

    {{- if .Values.ionscale.derp.enabled }}
    derp:
      server:
        disabled: false
        region_id: {{ .Values.ionscale.derp.regionId }}
        region_code: {{ .Values.ionscale.derp.regionCode | quote }}
        region_name: {{ .Values.ionscale.derp.regionName | quote }}
        stun_port: {{ .Values.ionscale.derp.stunPort }}
    {{- end }}

    logging:
      level: {{ .Values.ionscale.logging.level }}
{{- end }}
