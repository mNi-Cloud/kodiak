    controller-gen.kubebuilder.io/version: v0.17.2
    {{- if .Values.crd.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: authkeys.kodiak.mnicloud.jp
spec:
  group: kodiak.mnicloud.jp
  names:
    kind: AuthKey
    listKind: AuthKeyList
    plural: authkeys
    shortNames:
    - kauthkey
    singular: authkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .spec.tailnetRef.name
      name: TAILNET
      type: string
    - jsonPath: .status.expiresAt
      name: EXPIRES
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AuthKey is the Schema for enrollment credentials.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuthKeySpec requests an Ionscale enrollment credential.
              AuthKey is intended for user or manually managed device enrollment. Kodiak
              Connectors use controller-owned bootstrap credentials instead.
            properties:
              ephemeral:
                default: false
                description: Ephemeral makes machines registered with this key ephemeral.
                type: boolean
                x-kubernetes-validations:
                - message: ephemeral is immutable; change rotationNonce to issue a
                    new key
                  rule: self == oldSelf
              expiry:
                description: Expiry is the lifetime of newly issued keys. Zero uses
                  the control-plane default.
                type: string
                x-kubernetes-validations:
                - message: expiry is immutable; change rotationNonce to issue a new
                    key
                  rule: self == oldSelf
              preAuthorized:
                default: false
                description: PreAuthorized authorizes machines immediately after registration.
                type: boolean
                x-kubernetes-validations:
                - message: preAuthorized is immutable; change rotationNonce to issue
                    a new key
                  rule: self == oldSelf
              rotationNonce:
                description: RotationNonce requests replacement when its value changes.
                maxLength: 128
                type: string
              secretName:
                description: SecretName is the Secret that receives TS_AUTH_KEY.
                type: string
                x-kubernetes-validations:
                - message: secretName is immutable
                  rule: self == oldSelf
              tags:
                description: Tags are fixed at issuance.
                items:
                  pattern: ^tag:[a-zA-Z0-9][a-zA-Z0-9-]*$
                  type: string
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: tags are immutable; change rotationNonce to issue a new
                    key
                  rule: self == oldSelf
