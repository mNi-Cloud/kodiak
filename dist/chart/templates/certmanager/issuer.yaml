{{- if and .Values.webhook.enable .Values.certmanager.enable }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kodiak.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kodiak.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
