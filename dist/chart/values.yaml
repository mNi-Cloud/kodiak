controllerManager:
  replicas: 1
  image:
    repository: ghcr.io/mni-cloud/kodiak
    # Empty follows Chart.appVersion. Set an immutable tag or digest to override.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  podLabels: {}
  podAnnotations: {}
  hostAliases: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  serviceAccountName: ""

tailscale:
  image: tailscale/tailscale:v1.98.9

# Optional managed-control-plane integration. Kodiak does not install or own
# Ionscale. Leave these values empty when only external control planes are used.
managedControlPlane:
  apiEndpoint: ""
  loginURL: ""
  skipTLSVerify: false
  adminKeySecretRef:
    name: ""
    key: systemAdminKey

rbac:
  enable: true

crd:
  enable: true
  keep: true
