apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-connector-role
  namespace: system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]