---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-kodiak-mnicloud-jp-v1alpha1-authkey
  failurePolicy: Fail
  name: mauthkey-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kodiak.mnicloud.jp
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - authkeys
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-kodiak-mnicloud-jp-v1alpha1-connector
  failurePolicy: Fail
  name: mconnector-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kodiak.mnicloud.jp
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - connectors
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-kodiak-mnicloud-jp-v1alpha1-controlserver
  failurePolicy: Fail
  name: mcontrolserver-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kodiak.mnicloud.jp
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - controlservers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-kodiak-mnicloud-jp-v1alpha1-tailnet
  failurePolicy: Fail
  name: mtailnet-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kodiak.mnicloud.jp
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tailnets
  sideEffects: None
