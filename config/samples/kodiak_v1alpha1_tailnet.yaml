apiVersion: kodiak.mnicloud.jp/v1alpha1
kind: Tailnet
metadata:
  labels:
    app.kubernetes.io/name: kodiak
    app.kubernetes.io/managed-by: kustomize
  name: tailnet-sample
spec:
  # Tailnet name (as seen in ionscale)
  name: "my-tailnet"

  # Optional IAM policy (HuJSON)
  iamPolicy: |
    {
      "groups": {
        "group:admin": ["user@example.com"]
      }
    }

  # Optional ACL policy (HuJSON)
  aclPolicy: |
    {
      "groups": {
        "group:admin": ["user@example.com"]
      },
      "acls": [
        {
          "action": "accept",
          "src": ["*"],
          "dst": ["*:*"]
        }
      ],
      "autoApprovers": {
        "routes": {
          "10.244.0.0/16": ["tag:k8s"],
          "10.96.0.0/12": ["tag:k8s"]
        }
      }
    }

  # DNS configuration
  dnsConfig:
    magicDns: true
    nameservers:
      - "8.8.8.8"
      - "8.8.4.4"
    # domains:
    #   - "corp.example.com"
    # searchDomains:
    #   - "svc.cluster.local"

  # Optional feature toggles
  serviceCollectionEnabled: false
  fileSharingEnabled: true
  sshEnabled: true
  machineAuthorizationEnabled: false
