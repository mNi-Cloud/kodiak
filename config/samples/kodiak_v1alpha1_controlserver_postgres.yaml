apiVersion: kodiak.mnicloud.jp/v1alpha1
kind: ControlServer
metadata:
  labels:
    app.kubernetes.io/name: kodiak
    app.kubernetes.io/managed-by: kustomize
  name: controlserver-postgres
spec:
  image: ghcr.io/jsiebens/ionscale:latest
  replicas: 1
  config:
    # Core listener configuration
    listenAddr: ":8080"
    metricsListenAddr: ":9091"
    stunListenAddr: ":3478"
    publicAddr: "controlserver.example.com:443"
    stunPublicAddr: "controlserver.example.com:3478"

    # PostgreSQL database configuration (recommended for production)
    database:
      type: postgres
      # Use urlSecretRef for production (recommended)
      urlSecretRef:
        name: postgres-credentials
        key: database-url
      # Or use plain URL for development (not recommended for production)
      # url: "postgres://user:password@postgres-service:5432/ionscale?sslmode=require"

    # TLS with ACME (Let's Encrypt)
    tls:
      disable: false
      forceHttps: true
      acmeEnabled: true
      acmeEmail: "admin@example.com"
      # Use Let's Encrypt production for real certificates
      # acmeCa: "https://acme-v02.api.letsencrypt.org/directory"
      # Use Let's Encrypt staging for testing
      acmeCa: "https://acme-staging-v02.api.letsencrypt.org/directory"
      acmePath: "/data/acme"

    # DERP configuration
    derp:
      server:
        disabled: false
        regionId: 1000
        regionCode: "kodiak"
        regionName: "Kodiak Embedded DERP"
      sources:
        - https://controlplane.tailscale.com/derpmap/default

    # DNS configuration
    dns:
      magicDnsSuffix: "tailnet.example.com"

    # Authentication with OIDC
    auth:
      oidc:
        issuer: "https://accounts.google.com"
        clientId: "your-client-id.apps.googleusercontent.com"
        clientSecretRef:
          name: oidc-credentials
          key: client-secret
        additionalScopes:
          - "email"
          - "profile"
      systemAdmins:
        emails:
          - "admin@example.com"

    # Logging configuration
    logging:
      format: "json"
      level: "info"

  # No storage needed with PostgreSQL (optional for ACME cache)
  storage:
    size: "1Gi"
    storageClassName: "standard"

  resources:
    limits:
      cpu: "1"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
---
# Example Secret for PostgreSQL credentials
# Create this secret before applying the ControlServer
# kubectl create secret generic postgres-credentials \
#   --from-literal=database-url='postgres://ionscale:password@postgres:5432/ionscale?sslmode=require'
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  database-url: "postgres://ionscale:CHANGE_ME@postgres-service:5432/ionscale?sslmode=require"
---
# Example Secret for OIDC credentials
# Create this secret before applying the ControlServer
# kubectl create secret generic oidc-credentials \
#   --from-literal=client-secret='your-client-secret'
apiVersion: v1
kind: Secret
metadata:
  name: oidc-credentials
type: Opaque
stringData:
  client-secret: "CHANGE_ME"
