apiVersion: kodiak.mnicloud.jp/v1alpha1
kind: Connector
metadata:
  labels:
    app.kubernetes.io/name: kodiak
    app.kubernetes.io/managed-by: kustomize
  name: connector-sample
spec:
  # Optional dependency configuration
  # dependsOn:
  #   name: some-dependency
  #   namespace: default
  metadata:
    labels:
      app.kubernetes.io/component: tailscale-connector
  spec:
    tailscale:
      # Method 1: Using manual auth key
      # authKey: "tskey-auth-xxxxx"

      # Method 1-b: Using an existing Kubernetes secret (TS_AUTH_KEY)
      # authKeySecretRef:
      #   name: existing-tailscale-auth
      #   key: TS_AUTH_KEY

      # Method 2: Using AuthKey resource (recommended)
      # This will automatically use the auth key from the referenced AuthKey resource
      authKeyRef:
        name: authkey-sample
      # (The controller resolves status.secretRef and mounts TS_AUTH_KEY automatically)

      # Optional: Tailscale image version (defaults to "stable")
      version: "stable"

      # Optional: Control server URL
      # By default, uses the ionscale endpoint configured in the Kodiak controller
      # Only override this if you need to connect to a different control server
      # controlServerUrl: "https://controlserver.example.com"

      # Required: Networks to advertise (CIDR format)
      advertiseRoutes:
        - "10.244.0.0/24"   # Pod CIDR
        - "10.96.0.0/12"    # Service CIDR

      # Optional: Enable USERSPACE networking mode (defaults to true)
      # This is the default mode and is specified in the requirements
      userspaceNetworking: true

      # Optional: Hostname for the Tailscale node
      hostname: "k8s-connector"

      # Optional: Accept DNS configuration from Tailscale network (defaults to false)
      acceptDns: false
    # Optional: Resource requirements for the Tailscale container
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
