# Patch to add data volume for SQLite storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ionscale
spec:
  template:
    spec:
      containers:
      - name: ionscale
        volumeMounts:
        - name: data
          mountPath: /var/lib/ionscale
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ionscale-data
