# ionscale configuration - PostgreSQL backend
# Reference: https://jsiebens.github.io/ionscale/configuration/

# =============================================================================
# Network Settings
# =============================================================================
listen_addr: ":8080"
metrics_listen_addr: ":9091"
stun_listen_addr: ":3478"

# Public address - client-facing HTTPS endpoint (required)
public_addr: "http://ionscale.kodiak-system.svc.cluster.local:8080"

# Public STUN endpoint
stun_public_addr: "ionscale.kodiak-system.svc.cluster.local:3478"

# =============================================================================
# Database Settings
# =============================================================================
database:
  type: postgres
  url: postgres://ionscale:changeme@postgres.kodiak-system.svc:5432/ionscale?sslmode=disable
  # max_open_conns: 0
  # max_idle_conns: 0
  # conn_max_life_time: ""
  # conn_max_idle_time: ""

# =============================================================================
# TLS Settings
# =============================================================================
tls:
  disable: true
  force_https: false
  # cert_file: ""
  # key_file: ""
  # acme: false
  # acme_email: ""
  # acme_ca: ""

# =============================================================================
# Keys
# =============================================================================
# Note: For production, override this secret or use Helm chart
keys:
  system_admin_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  # control_key: ""
  # legacy_control_key: ""

