apiVersion: v1
kind: Service
metadata:
  name: ionscale
  labels:
    app.kubernetes.io/name: ionscale
spec:
  selector:
    app.kubernetes.io/name: ionscale
  ports:
  - name: api
    port: 8080
    targetPort: api
  - name: metrics
    port: 9091
    targetPort: metrics
  - name: stun
    port: 3478
    targetPort: stun
    protocol: UDP
