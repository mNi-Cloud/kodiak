apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- service.yaml

# Default: Development key (DO NOT use in production)
# Production deployments should override this secret
# Key must be 64 hex characters (32 bytes)
secretGenerator:
- name: ionscale-admin
  literals:
  - systemAdminKey=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  options:
    disableNameSuffixHash: true

commonLabels:
  app.kubernetes.io/part-of: kodiak
