name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - test
          - lint
          - generated-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        if: matrix.check == 'test'
        run: make test

      - name: Run linter
        if: matrix.check == 'lint'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      - name: Setup Helm
        if: matrix.check == 'generated-artifacts'
        uses: azure/setup-helm@v4

      - name: Validate generated and packaged resources
        if: matrix.check == 'generated-artifacts'
        run: |
          make manifests generate
          git diff --exit-code -- api config/crd config/rbac
          hack/verify-chart.sh
          make kustomize
          bin/kustomize build config/default >/dev/null
          bin/kustomize build config/samples >/dev/null
          helm lint dist/chart
